name: Playwright Tests + Allure Report

on:
  # ✅ Run on every push to main or develop
  push:
    branches: [main, develop]

  # ✅ Run on every pull request targeting main
  pull_request:
    branches: [main]

  # ✅ Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  test:
    name: Run Playwright Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── 1. Checkout code ──────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Setup Node.js ──────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── 3. Install dependencies ───────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── 4. Install Playwright browsers ───────────────────────────────
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # ── 5. Install Allure CLI ─────────────────────────────────────────
      - name: Install Allure CLI
        run: npm install -g allure-commandline --save-dev

      # ── 6. Create .env from GitHub Secrets ───────────────────────────
      - name: Create .env file
        run: |
          echo "BASE_URL=${{ secrets.BASE_URL }}"         >> .env
          echo "VALID_EMAIL=${{ secrets.VALID_EMAIL }}"   >> .env
          echo "VALID_PASSWORD=${{ secrets.VALID_PASSWORD }}" >> .env

      # ── 7. Run Playwright tests ───────────────────────────────────────
      - name: Run Playwright tests
        run: npx playwright test
        continue-on-error: true   # ✅ Don't stop — we still want the report

      # ── 8. Generate Allure report ─────────────────────────────────────
      - name: Generate Allure report
        if: always()              # ✅ Always generate even if tests fail
        run: allure generate allure-results --clean -o allure-report

      # ── 9. Upload Allure report as artifact ───────────────────────────
      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 30

      # ── 10. Upload Playwright HTML report ─────────────────────────────
      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: reports/html-report/
          retention-days: 30

      # ── 11. Upload videos (always, not just on failure) ───────────────
      - name: Upload test videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-videos
          path: test-results/
          retention-days: 15

      # ── 12. Publish Allure report to GitHub Pages ─────────────────────
      - name: Deploy Allure report to GitHub Pages
        if: github.ref == 'refs/heads/main' && always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report
          publish_branch: gh-pages
          destination_dir: allure-report