name: Playwright Tests — Staging

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why are you running this manually?'
        required: false
        default: 'Manual staging run'

jobs:
  test-staging:
    name: Run Tests on Staging
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run Playwright tests — Staging
        run: npm test
        continue-on-error: true
        env:
          CI: 'true'
          BASE_URL: ${{ secrets.STAGING_BASE_URL }}        # ← staging URL
          VALID_EMAIL: ${{ secrets.STAGING_VALID_EMAIL }}
          VALID_PASSWORD: ${{ secrets.STAGING_VALID_PASSWORD }}
          INVALID_EMAIL: ${{ secrets.INVALID_EMAIL }}
          INVALID_PASSWORD: ${{ secrets.INVALID_PASSWORD }}

      - name: Generate Allure report
        if: always()
        run: npx allure generate allure-results --clean -o allure-report

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-allure-report-${{ github.run_number }}
          path: allure-report/
          retention-days: 14

      - name: Report failure
        if: failure()
        run: |
          echo "❌ STAGING TESTS FAILED"
          echo "Run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          exit 1

      - name: Report success
        if: success()
        run: echo "✅ STAGING TESTS PASSED — Run ${{ github.run_number }}"