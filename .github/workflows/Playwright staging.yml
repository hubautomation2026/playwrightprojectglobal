name: 🎭 Playwright Staging Tests

on:
  push:
    branches: [main, develop]

  pull_request:
    branches: [main]

  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Which tests to run?'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - login
          - register
          - search
          - cart         # ← was missing from the options list

  schedule:
    - cron: '0 6 * * *'

# Cancel previous run on same branch if a new push comes in
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── STEP 1: Install once, cache browsers for all test jobs ───────────
  install:
    name: 📦 Install Dependencies
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Cache Playwright browsers
        id: cache-browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.cache-browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

  # ── STEP 2a: Login tests ──────────────────────────────────────────────
  login-tests:
    name: 🔐 Login Tests
    runs-on: ubuntu-latest
    needs: install
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    if: |
      github.event.inputs.test_suite == 'all' ||
      github.event.inputs.test_suite == 'login' ||
      github.event.inputs.test_suite == ''
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npx playwright install-deps chromium

      - name: Run Login Tests
        run: npx playwright test tests/login.spec.ts --project=chromium
        continue-on-error: true
        env:
          CI: 'true'
          BASE_URL: ${{ secrets.STAGING_BASE_URL }}
          VALID_EMAIL: ${{ secrets.STAGING_VALID_EMAIL }}
          VALID_PASSWORD: ${{ secrets.STAGING_VALID_PASSWORD }}
          INVALID_EMAIL: ${{ secrets.INVALID_EMAIL }}
          INVALID_PASSWORD: ${{ secrets.INVALID_PASSWORD }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: login-test-report-${{ github.run_number }}
          path: reports/
          retention-days: 14
          if-no-files-found: warn

  # ── STEP 2b: Register tests ───────────────────────────────────────────
  register-tests:
    name: 📝 Registration Tests
    runs-on: ubuntu-latest
    needs: install
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    if: |
      github.event.inputs.test_suite == 'all' ||
      github.event.inputs.test_suite == 'register' ||
      github.event.inputs.test_suite == ''
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npx playwright install-deps chromium

      - name: Run Registration Tests
        run: npx playwright test tests/register.spec.ts --project=chromium
        continue-on-error: true
        env:
          CI: 'true'
          BASE_URL: ${{ secrets.STAGING_BASE_URL }}
          VALID_EMAIL: ${{ secrets.STAGING_VALID_EMAIL }}
          VALID_PASSWORD: ${{ secrets.STAGING_VALID_PASSWORD }}
          INVALID_EMAIL: ${{ secrets.INVALID_EMAIL }}
          INVALID_PASSWORD: ${{ secrets.INVALID_PASSWORD }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: register-test-report-${{ github.run_number }}
          path: reports/
          retention-days: 14
          if-no-files-found: warn

  # ── STEP 2c: Search tests ─────────────────────────────────────────────
  search-tests:
    name: 🔍 Search Tests
    runs-on: ubuntu-latest
    needs: install
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    if: |
      github.event.inputs.test_suite == 'all' ||
      github.event.inputs.test_suite == 'search' ||
      github.event.inputs.test_suite == ''
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npx playwright install-deps chromium

      - name: Run Search Tests
        run: npx playwright test tests/search.spec.ts --project=chromium
        continue-on-error: true
        env:
          CI: 'true'
          BASE_URL: ${{ secrets.STAGING_BASE_URL }}
          VALID_EMAIL: ${{ secrets.STAGING_VALID_EMAIL }}
          VALID_PASSWORD: ${{ secrets.STAGING_VALID_PASSWORD }}
          INVALID_EMAIL: ${{ secrets.INVALID_EMAIL }}
          INVALID_PASSWORD: ${{ secrets.INVALID_PASSWORD }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: search-test-report-${{ github.run_number }}
          path: reports/
          retention-days: 14
          if-no-files-found: warn

  # ── STEP 2d: Cart tests ───────────────────────────────────────────────
  cart-tests:                          # ← lowercase 't' — must match exactly in notify job below
    name: 🛒 Cart Tests
    runs-on: ubuntu-latest
    needs: install
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    if: |
      github.event.inputs.test_suite == 'all' ||
      github.event.inputs.test_suite == 'cart' ||
      github.event.inputs.test_suite == ''
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npx playwright install-deps chromium

      - name: Run Cart Tests
        run: npx playwright test tests/cart.spec.ts --project=chromium
        continue-on-error: true
        env:
          CI: 'true'
          BASE_URL: ${{ secrets.STAGING_BASE_URL }}
          VALID_EMAIL: ${{ secrets.STAGING_VALID_EMAIL }}
          VALID_PASSWORD: ${{ secrets.STAGING_VALID_PASSWORD }}
          INVALID_EMAIL: ${{ secrets.INVALID_EMAIL }}
          INVALID_PASSWORD: ${{ secrets.INVALID_PASSWORD }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cart-test-report-${{ github.run_number }}
          path: reports/
          retention-days: 14
          if-no-files-found: warn

  # ── STEP 3: Summary — runs after ALL test jobs finish ─────────────────
  notify:
    name: 📊 Test Summary
    runs-on: ubuntu-latest
    needs: [login-tests, register-tests, search-tests, cart-tests]   # ← cart-tests (lowercase t, matches job name above)
    if: always()
    steps:

      - name: All tests passed
        if: |
          needs.login-tests.result == 'success' &&
          needs.register-tests.result == 'success' &&
          needs.search-tests.result == 'success' &&
          needs.cart-tests.result == 'success'
        run: |
          echo "✅ ALL STAGING TESTS PASSED"
          echo "──────────────────────────────"
          echo "  Login Tests:        PASSED ✅"
          echo "  Registration Tests: PASSED ✅"
          echo "  Search Tests:       PASSED ✅"
          echo "  Cart Tests:         PASSED ✅"

      - name: Some tests failed
        if: |
          needs.login-tests.result == 'failure' ||
          needs.register-tests.result == 'failure' ||
          needs.search-tests.result == 'failure' ||
          needs.cart-tests.result == 'failure'
        run: |
          echo "❌ SOME STAGING TESTS FAILED"
          echo "──────────────────────────────"
          echo "  Login Tests:        ${{ needs.login-tests.result }}"
          echo "  Registration Tests: ${{ needs.register-tests.result }}"
          echo "  Search Tests:       ${{ needs.search-tests.result }}"
          echo "  Cart Tests:         ${{ needs.cart-tests.result }}"
          echo "──────────────────────────────"
          echo "Run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          exit 1
