name: 🎭 Playwright Stage Tests

on:
  push:
    branches: [main, develop]

  pull_request:
    branches: [main]

  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Which tests to run?'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - login
          - register
          - search

  schedule:
    - cron: '0 6 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    name: 📦 Install Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Cache Playwright browsers
        id: cache-browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.cache-browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

  login-tests:
    name: 🔐 Login Tests
    runs-on: ubuntu-latest
    needs: install
    if: |
      github.event.inputs.test_suite == 'all' ||
      github.event.inputs.test_suite == 'login' ||
      github.event.inputs.test_suite == ''
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npx playwright install-deps chromium

      - name: Run Login Tests
        run: npx playwright test tests/login.spec.ts --project=chromium
        env:
             CI: "true"
             BASE_URL: ${{ secrets.STAGING_BASE_URL }}   
             VALID_EMAIL: ${{ secrets.STAGING_VALID_EMAIL }}
             VALID_PASSWORD: ${{ secrets.STAGING_VALID_PASSWORD }}

            

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: login-test-report
          path: reports/
          retention-days: 30

  register-tests:
    name: 📝 Registration Tests
    runs-on: ubuntu-latest
    needs: install
    if: |
      github.event.inputs.test_suite == 'all' ||
      github.event.inputs.test_suite == 'register' ||
      github.event.inputs.test_suite == ''
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npx playwright install-deps chromium

      - name: Run Registration Tests
        run: npx playwright test tests/register.spec.ts --project=chromium
        env:
             CI: "true"
             BASE_URL: ${{ secrets.STAGING_BASE_URL }}   
             VALID_EMAIL: ${{ secrets.STAGING_VALID_EMAIL }}
             VALID_PASSWORD: ${{ secrets.STAGING_VALID_PASSWORD }}
          

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: register-test-report
          path: reports/
          retention-days: 30

  search-tests:
    name: 🔍 Search Tests
    runs-on: ubuntu-latest
    needs: install
    if: |
      github.event.inputs.test_suite == 'all' ||
      github.event.inputs.test_suite == 'search' ||
      github.event.inputs.test_suite == ''
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npx playwright install-deps chromium

      - name: Run Search Tests
        run: npx playwright test tests/search.spec.ts --project=chromium
        env:
             CI: "true"
             BASE_URL: ${{ secrets.STAGING_BASE_URL }}   
             VALID_EMAIL: ${{ secrets.STAGING_VALID_EMAIL }}
             VALID_PASSWORD: ${{ secrets.STAGING_VALID_PASSWORD }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: search-test-report
          path: reports/
          retention-days: 30
  Cart-tests:
    name: 🔍 Cart Tests
    runs-on: ubuntu-latest
    needs: install
    if: |
      github.event.inputs.test_suite == 'all' ||
      github.event.inputs.test_suite == 'cart' ||
      github.event.inputs.test_suite == ''
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npx playwright install-deps chromium

      - name: Run Search Tests
        run: npx playwright test tests/cart.spec.ts --project=chromium
        env:
             CI: "true"
             BASE_URL: ${{ secrets.STAGING_BASE_URL }}   
             VALID_EMAIL: ${{ secrets.STAGING_VALID_EMAIL }}
             VALID_PASSWORD: ${{ secrets.STAGING_VALID_PASSWORD }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Cart-test-report
          path: reports/
          retention-days: 30
  notify:
    name: 📊 Test Summary
    runs-on: ubuntu-latest
    needs: [login-tests, register-tests, search-tests,Cart-Tests]
    if: always()
    steps:
      - name: All stage tests passed
        if: needs.login-tests.result == 'success' && needs.register-tests.result == 'success' && needs.search-tests.result == 'success'
        run: |
          echo "✅ ALL TESTS PASSED"
          echo "  Login Tests:        PASSED"
          echo "  Registration Tests: PASSED"
          echo "  Search Tests:       PASSED"
          echo "  Cart Tests:       PASSED"
      - name: Some tests failed
        if: needs.login-tests.result == 'failure' || needs.register-tests.result == 'failure' || needs.search-tests.result == 'failure'
        run: |
          echo "❌ SOME STAGE TESTS FAILED"
          echo "  Login Tests:        ${{ needs.login-tests.result }}"
          echo "  Registration Tests: ${{ needs.register-tests.result }}"
          echo "  Search Tests:       ${{ needs.search-tests.result }}"
          exit 1
