name: Playwright Smoke Tests

# Smoke runs on EVERY push to main
# Fast — only critical path tests
# Goal: know within 60 seconds if the site is alive

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why are you running this manually?'
        required: false
        default: 'Manual smoke run'

jobs:
  smoke:
    name: Smoke Tests (@smoke)
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      # ── Run ONLY @smoke tagged tests ──────────────────────────────────
      # Using npx directly — does NOT depend on package.json scripts
      # continue-on-error: true means pipeline keeps running so report is always generated
      - name: Run smoke tests
        run: npx playwright test --grep @smoke
        continue-on-error: true
        env:
          CI: 'true'
          BASE_URL: ${{ secrets.STAGING_BASE_URL }}
          VALID_EMAIL: ${{ secrets.STAGING_VALID_EMAIL }}
          VALID_PASSWORD: ${{ secrets.STAGING_VALID_PASSWORD }}
          INVALID_EMAIL: ${{ secrets.INVALID_EMAIL }}
          INVALID_PASSWORD: ${{ secrets.INVALID_PASSWORD }}

      # ── Reports ───────────────────────────────────────────────────────
      - name: Generate Allure report
        if: always()
        run: |
          if [ -d "allure-results" ]; then
            npx allure generate allure-results --clean -o allure-report
            echo "✅ Allure report generated"
          else
            echo "⚠️ No allure-results folder found"
            echo "Make sure allure-playwright is in package.json and set in playwright.config.ts reporter"
          fi

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-allure-report-${{ github.run_number }}
          path: allure-report/
          retention-days: 7
          if-no-files-found: warn

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-playwright-report-${{ github.run_number }}
          path: playwright-report/
          retention-days: 7
          if-no-files-found: warn

      # ── Notifications ─────────────────────────────────────────────────
      - name: Report failure
        if: failure()
        run: |
          echo "❌ SMOKE TESTS FAILED — critical path is broken"
          echo "──────────────────────────────────────────────"
          echo "Repository : ${{ github.repository }}"
          echo "Branch     : ${{ github.ref_name }}"
          echo "Triggered  : ${{ github.actor }}"
          echo "Run number : ${{ github.run_number }}"
          echo "Run URL    : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "──────────────────────────────────────────────"
          exit 1

      - name: Report success
        if: success()
        run: echo "✅ SMOKE TESTS PASSED — Run ${{ github.run_number }}"
